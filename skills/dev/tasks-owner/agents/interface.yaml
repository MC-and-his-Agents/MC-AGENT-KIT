interface:
  display_name: "Tasks Owner"
  short_description: "以有效批次统筹 GitHub 结果、依赖和收口"
  default_prompt: "使用 $tasks-owner：先回读 GitHub truth，按有效批次、验收矩阵、依赖、scope 和 review preflight 推进；事件未消费或缺授权/证据时暂停并纠偏。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Codex App 原生任务线程、Automation 或 Subagent 能力缺失时保持只读并报告。"
