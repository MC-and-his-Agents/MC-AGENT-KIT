name: Skill feedback
description: 提交 PMO、Tasks Owner 或平台执行行为的脱敏复盘反馈
title: "[Skill feedback] "
body:
  - type: markdown
    attributes:
      value: |
        本表单是 `dev-orchestration-contract.json` 中 Skill feedback schema 的人类投影。
        请勿提交凭据、完整线程、私有代码、未授权业务数据或不必要的绝对路径。
  - type: dropdown
    id: affected_skill
    attributes:
      label: Affected skill
      options:
        - pmo
        - tasks-owner
        - platform / host
    validations:
      required: true
  - type: dropdown
    id: retrospective_trigger
    attributes:
      label: Retrospective trigger
      options:
        - user_correction
        - explicit_skill_correction
        - repeated_failure
        - post_repair_recurrence
        - no_product_progress
        - scope_dependency_ownership_drift
        - source_of_truth_conflict
        - repeated_platform_assumption_failure
        - high_impact_incident
    validations:
      required: true
  - type: textarea
    id: observed_behavior
    attributes:
      label: Observed behavior
      description: 说明实际发生的执行行为，不复制完整线程。
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior or violated invariant
    validations:
      required: true
  - type: textarea
    id: product_impact
    attributes:
      label: Product impact
    validations:
      required: true
  - type: textarea
    id: current_resolution
    attributes:
      label: Current resolution
      description: 记录当前产品已如何恢复；反馈本身不算产品进展。
    validations:
      required: true
  - type: textarea
    id: generalizable_root_cause
    attributes:
      label: Generalizable root-cause reasoning
    validations:
      required: true
  - type: textarea
    id: proposed_regression
    attributes:
      label: Proposed regression or holdout
    validations:
      required: true
  - type: textarea
    id: redacted_evidence
    attributes:
      label: Redacted evidence locator
      description: 只提供足以回读且可公开的 locator；无法安全脱敏时不要提交。
    validations:
      required: true
  - type: input
    id: fingerprint_occurrence
    attributes:
      label: Fingerprint and occurrence
      description: 使用稳定语义 fingerprint，并注明 first occurrence 或 occurrence locator。
    validations:
      required: true
