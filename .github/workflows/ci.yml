name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Resolve latest official Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false and .published_at != null) | [.published_at, .tag_name] | @tsv' \
              | sort | tail -n 1 | cut -f 2
          )"
          test -n "$latest"
          git rev-parse --verify "$latest^{commit}"
          echo "LATEST_RELEASE_TAG=$latest" >> "$GITHUB_ENV"
      - name: Validate repository contracts
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/validate-repository.py --base-ref "$BASE_REF"
          else
            python3 scripts/validate-repository.py
          fi
          python3 scripts/validate-repository.py --self-test
          python3 scripts/repository_artifacts.py --self-test
          python3 scripts/repository_release.py --self-test
      - name: Derive pending artifacts
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/repository_artifacts.py \
            --base "$LATEST_RELEASE_TAG" \
            --target "$TARGET_SHA" \
            --format markdown \
            --json-output "$RUNNER_TEMP/artifact-diff.json" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Check Python and shell syntax
        env:
          PYTHONPYCACHEPREFIX: /tmp/mc-agent-kit-pycache
        run: |
          python3 -m compileall -q scripts skills plugins
          find scripts plugins skills -type f -name '*.sh' -exec bash -n {} +
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Check patch whitespace
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_REF" && "$BASE_REF" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BASE_REF"...HEAD
          else
            git diff --check HEAD^ HEAD
          fi
