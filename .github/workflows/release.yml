name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable repository version, for example v0.1.1
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      ci_url: ${{ steps.facts.outputs.ci_url }}
      previous_tag: ${{ steps.facts.outputs.previous_tag }}
      release_tag: ${{ steps.facts.outputs.release_tag }}
      target_sha: ${{ steps.facts.outputs.target_sha }}
    steps:
      - name: Require main dispatch
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Verify immutable release inputs
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse HEAD)"
          api_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$target_sha" = "$GITHUB_SHA"
          test "$target_sha" = "$api_main"

          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --slurp > "$releases"
          jq 'add' "$releases" > "$RUNNER_TEMP/releases-flat.json"
          previous_tag="$(
            jq -er '
              map(select(.draft == false and .prerelease == false and .published_at != null))
              | sort_by(.published_at) | last | .tag_name
            ' "$RUNNER_TEMP/releases-flat.json"
          )"
          git rev-parse --verify "$previous_tag^{commit}"
          git merge-base --is-ancestor "$previous_tag^{commit}" "$target_sha"

          test "$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
              --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length"
          )" = "0"
          test "$(
            jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)] | length' \
              "$RUNNER_TEMP/releases-flat.json"
          )" = "0"

          runs="$RUNNER_TEMP/ci-runs.json"
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f status=success -f per_page=100 > "$runs"
          ci_url="$(
            jq -er --arg sha "$target_sha" '
              [.workflow_runs[]
                | select(.head_sha == $sha and .status == "completed" and .conclusion == "success")]
              | sort_by(.created_at) | last | .html_url
            ' "$runs"
          )"

          {
            echo "ci_url=$ci_url"
            echo "previous_tag=$previous_tag"
            echo "release_tag=$RELEASE_TAG"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"
      - name: Validate candidate
        env:
          PYTHONPYCACHEPREFIX: /tmp/mc-skills-pycache
        run: |
          python3 scripts/validate-repository.py --base-ref "${{ steps.facts.outputs.previous_tag }}"
          python3 scripts/validate-repository.py --self-test
          python3 scripts/repository_artifacts.py --self-test
          python3 scripts/repository_release.py --self-test
          python3 -m compileall -q scripts skills plugins
          find scripts plugins skills -type f -name '*.sh' -exec bash -n {} +
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
          git diff --check "${{ steps.facts.outputs.previous_tag }}"...HEAD
      - name: Generate release ledger
        run: |
          mkdir "$RUNNER_TEMP/release"
          python3 scripts/repository_release.py \
            --base "${{ steps.facts.outputs.previous_tag }}" \
            --target "${{ steps.facts.outputs.target_sha }}" \
            --release-tag "${{ steps.facts.outputs.release_tag }}" \
            --json-output "$RUNNER_TEMP/release/artifacts.json" \
            --notes-output "$RUNNER_TEMP/release/release-notes.md" \
            --ci-url "${{ steps.facts.outputs.ci_url }}" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: release-ledger
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ledger
          path: ${{ runner.temp }}/release
      - name: Recheck and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(jq -r .release.tag "$RUNNER_TEMP/release/artifacts.json")" = "$RELEASE_TAG"
          test "$(jq -r .release.target_commit "$RUNNER_TEMP/release/artifacts.json")" = "$TARGET_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$TARGET_SHA"
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" \
              --jq "[.[] | select(.ref == \"refs/tags/$RELEASE_TAG\")] | length"
          )" = "0"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/artifacts.json#artifacts.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release/release-notes.md" \
            --latest

  verify:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-ledger
          path: ${{ runner.temp }}/expected
      - name: Read back published facts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
        run: |
          set -euo pipefail
          tag="$RUNNER_TEMP/tag.json"
          release="$RUNNER_TEMP/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$tag"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,targetCommitish,isDraft,isPrerelease,url,body,assets > "$release"
          test "$(jq -r .object.type "$tag")" = "commit"
          test "$(jq -r .object.sha "$tag")" = "$TARGET_SHA"
          test "$(jq -r .tagName "$release")" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish "$release")" = "$TARGET_SHA"
          test "$(jq -r .isDraft "$release")" = "false"
          test "$(jq -r .isPrerelease "$release")" = "false"
          test "$(jq '[.assets[] | select(.name == "artifacts.json")] | length' "$release")" = "1"

          mkdir "$RUNNER_TEMP/actual"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern artifacts.json --dir "$RUNNER_TEMP/actual"
          cmp "$RUNNER_TEMP/expected/artifacts.json" "$RUNNER_TEMP/actual/artifacts.json"
          jq -j .body "$release" > "$RUNNER_TEMP/actual/release-notes.md"
          cmp "$RUNNER_TEMP/expected/release-notes.md" "$RUNNER_TEMP/actual/release-notes.md"

          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "- Target: \`$TARGET_SHA\`"
            echo "- CI: ${{ needs.prepare.outputs.ci_url }}"
            echo "- Release: $(jq -r .url "$release")"
          } >> "$GITHUB_STEP_SUMMARY"
